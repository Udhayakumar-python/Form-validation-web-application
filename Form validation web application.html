<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
body{
   position: relative;
   width: 100vw;
    height: 100vh;
    overflow: hidden;
   
}
   .form{
    width: 20vw;
    height:40vh;
    background-color: grey;
    padding: 50px;
    position: absolute;
    left: 40%;
    top:30%;
    border: 2px solid rgb(82, 80, 80);
   }
   #summit{
    width: 90px;
    position: absolute;
    left: 33%;
    height: 15%;
    top: 85%;
    
   }
   #na{
    border: 1px solid rgb(66, 64, 64) ;
   }
   #nu{
     border: 1px solid rgb(66, 64, 64) ;
   }
   #ma{
     border: 1px solid rgb(66, 64, 64) ;
   }
   #summit{
    border: 1px solid rgb(66, 64, 64) ;
    background-color: rgb(109, 92, 92);
    border-radius: 10px;
   }
   img{ width: 100%;
    height: 100%;
    border: 2px solid rgb(237, 243, 237);
    
    }
   form{
    background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTihRh0FBjWXQl8yldz2143qHYR-CqeZe-3h184zYlQRLJoGQ27aX0n4mMB&s=10);
   background-size: cover;
   background-position: center;
   background-repeat: no-repeat;
}
input{
    background-color: rgb(49, 47, 47);
    color: ghostwhite;
}
::placeholder{
    color: ghostwhite;
}
label{
    color: ghostwhite;
}
#a1{
    color: white;
}
#a2{
    color: white;
}
#a3{
    color: white;
}
</style>
<body>
    <img src="https://static.vecteezy.com/system/resources/previews/060/445/267/non_2x/abstract-background-design-version-gradient-with-square-lines-in-blue-black-and-orange-for-branding-ads-social-media-wallpaper-website-etc-free-vector.jpg" alt="">
    <form onsubmit="return submitForm()" class="form" >
        
     <label for="na" style="font-family:Arial, Helvetica, sans-serif; position: absolute;
     left:68%">Name</label>
      <br>
     <input type="Name" id="na" placeholder="Enter Name"> 
     <br>
     <span id="a1" "></span>
     <br>
     <label for="nu"style="font-family: Arial, Helvetica, sans-serif; position: absolute;
     left:63%">Number</label> 
      <br> 
     <input type="number" id="nu" placeholder="Enter Number">
     <br>
     <span id="a2""></span>
     <br>
     <label for="ma"style="font-family: Arial, Helvetica, sans-serif; position: absolute;
     left:68%">Email</label>
      <br>
     <input type="email" id="ma" placeholder="Enter Mail Id">
     <br>
     <span id="a3""></span>
     <br><br>
     <input type="submit" id="summit">
     
    </form>
    <script>
        function submitForm(){
           let Name= document.getElementById("na").value;
           let Number=document.getElementById("nu").value;
           let Mail=document.getElementById("ma").value;

           if(Name==""){
            document.getElementById("a1").innerHTML="Kindly enter name";
            return false;
           }
           else{
             document.getElementById("a1").innerHTML="";
           }
           
           if(Number==""){
            document.getElementById("a2").innerHTML=" Kindly Enter Number";
           return false;
           }
           else if(isNaN(Number)){
            document.getElementById('a2').innerHTML="Kindly Enter Number type";
            return false;
           }
           else{
            document.getElementById("a2").innerHTML="";
           }
           if(Mail==""){
            document.getElementById('a3').innerHTML="Kindly Enter Email"
            return false;
            }
            else{
               document.getElementById('a3').innerHTML=""  
            }
            alert("FORM SUBMITTED");
          return true;
         
        }
    </script>
</body>
</html>
